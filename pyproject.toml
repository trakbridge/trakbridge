[project]
name = "trakbridge"
dynamic = ["version"]
description = "TrakBridge Feed Streaming Platform"
authors = [{ name = "Trakbridge", email = "support@trakbridge.io" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiocache>=0.12.0",
    "aiohappyeyeballs",
    "aiohttp>=3.10.0",
    "aiosignal",
    "alembic",
    "apispec[marshmallow]>=6.6.0,<7.0.0",
    "apispec-webframeworks>=1.2.0,<2.0.0",
    "arrow",
    "attrs",
    "bcrypt>=4.0.0",
    "blinker",
    "certifi",
    "cffi",
    "click",
    "cryptography",
    "defusedxml",
    "fastkml",
    "Flask>=3.0.0,<4.0.0",
    "Flask-Limiter>=3.5.0,<4.0.0",
    "Flask-Login>=0.6.0,<1.0.0",
    "Flask-Migrate>=4.0.0,<5.0.0",
    "Flask-WTF>=1.1.0,<2.0.0",
    "flask-talisman>=1.1.0,<2.0.0",
    "Flask-OIDC>=1.4.0,<2.0.0",
    "Flask-SQLAlchemy>=3.1.0,<4.0.0",
    "frozenlist",
    "gunicorn>=21.0.0,<24.0.0",
    "gevent>=23.0.0,<25.0.0",
    "hypercorn[uvloop,h2,quic]>=0.17.0,<0.18.0",
    "idna",
    "itsdangerous",
    "Jinja2",
    "ldap3>=2.9.0",
    "lxml",
    "Mako",
    "MarkupSafe",
    "marshmallow>=3.21.0,<4.0.0",
    "mgrs",
    # msgpack floor closes GHSA-6v7p-g79w-8964 (HIGH); transitive via
    # aiocache. Declared here so the resolver cannot pick <1.2.1.
    "msgpack>=1.2.1",
    "multidict",
    "paho-mqtt",
    "propcache",
    "psutil",
    "psycopg2-binary",
    "pycparser",
    "pygeoif",
    "PyJWT>=2.8.0",
    "PyMySQL",
    "pytak",
    "takproto>=3.0.0,<4.0.0",
    "trakbridge-plugin-sdk>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "python-dateutil",
    "python-dotenv",
    "PyYAML",
    # setuptools floor closes CVE-2025-47273 (HIGH) and CVE-2026-59890.
    # The base image ships 70.3.0; without a floor here the resolver
    # keeps it because "any" is already satisfied.
    "setuptools>=83.0.0",
    "setuptools-scm",
    "six",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "types-python-dateutil",
    "watchdog",
    "Werkzeug>=3.0.0,<4.0.0",
    "yarl"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-html>=3.1.0",
    "pytest-json-report>=1.5.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "factory-boy>=3.2.0",
    "faker>=18.0.0",
    "responses>=0.23.0",
    "httpx>=0.24.0",
    "coverage>=7.0.0",
    "openapi-spec-validator>=0.7.1,<0.8.0",
    "bump2version",
    "pre-commit",
    "setuptools-scm>=8.0.0"
]

[build-system]
# setuptools floor closes CVE-2025-47273 and CVE-2026-59890 at build time.
requires = ["setuptools>=83.0.0", "wheel", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["services*", "routes*", "models*", "plugins*", "config*", "utils*", "tests*"]

# Dynamic versioning with setuptools-scm
[tool.setuptools_scm]
# Generate version file for runtime access
write_to = "_version.py"
write_to_template = '''
# coding: utf-8
# file generated by setuptools_scm
# don't change, don't track in version control
__version__ = version = "{version}"
__version_tuple__ = version_tuple = {version_tuple}
'''

# Root directory should be auto-detected, but we can be explicit
root = "."

# Simplified tag pattern - matches any tag starting with v
tag_regex = '^v(?P<version>[^+]+)(?P<sep>[+-]?)(?P<local>.*)$'

# Fallback version for when no tags are found
fallback_version = "0.1.0.dev0"

# Use no-guess-dev for cleaner version numbers
version_scheme = "no-guess-dev"

# Use node-and-date for local version identifier
local_scheme = "node-and-date"

# Don't normalize version (keep original format)
normalize = false

[tool.trakbridge.release]
# The version being worked toward. CI stamps dev/staging/main builds
# with this + a local segment so plugin `min_trakbridge_version` checks
# resolve correctly on non-tag builds. Bump after tagging a release
# (e.g. after tagging v2.2.0, set next = "2.3.0").
next = "2.2.0"

[tool.pytest.ini_options]
# Test discovery and execution
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Enhanced output for CI debugging
addopts = [
    "-v",                    # Verbose output
    "--tb=short",           # Shorter traceback format
    "--strict-markers",     # Treat unregistered markers as errors
    "--durations=10",       # Show 10 slowest tests
    "--maxfail=10",         # Stop after 10 failures
    "-p", "pytest_asyncio"  # Ensure asyncio plugin is loaded
]

# Test markers for categorization
markers = [
    "asyncio: Asynchronous tests that require asyncio event loop",
    "integration: Integration tests that require external dependencies",
    "ldap: Tests that require LDAP server connectivity",
    "oidc: Tests that require OIDC provider connectivity", 
    "performance: Performance and benchmarking tests",
    "security: Security-focused tests",
    "callsign: Callsign mapping functionality tests",
    "database: Database-specific tests",
    "mysql: Tests that require MySQL/MariaDB database connectivity",
    "mariadb: Tests specifically for MariaDB compatibility and features",
    "postgresql: Tests that require PostgreSQL database connectivity",
    "slow: Slow-running tests that may be skipped in quick runs",
    "benchmark: Performance benchmarking tests for optimization validation",
    "cot_service: Tests that require COT service functionality",
    "final_validation: Final validation tests for complete feature implementation",
    "e2e: End-to-end tests covering complete user workflows"
]

# Warning filters
filterwarnings = [
    "ignore::DeprecationWarning:pyasn1.*",
    "ignore::DeprecationWarning:aiohttp.*",
    "ignore:enable_cleanup_closed ignored:DeprecationWarning:aiohttp.*",
    "ignore::sqlalchemy.exc.LegacyAPIWarning",  # Ignore SQLAlchemy legacy API warnings
    "ignore::RuntimeWarning:cryptography.*",    # Ignore cryptography runtime warnings in tests
    "ignore::pytest.PytestUnraisableExceptionWarning",  # Ignore async mock warnings in tests
    "ignore::pytest.PytestCollectionWarning"   # Ignore collection warnings
]

# Minimum version requirements
minversion = "6.0"

# Asyncio mode for async tests
asyncio_mode = "auto"