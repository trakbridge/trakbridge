<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ self.code() }} {{ self.heading() }} — TrakBridge</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link href="{{ url_for('static', filename='css/google-fonts.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
    <style>
        :root {
            /* Match the app palette from templates/base.html */
            --primary-blue: #1e3a8a;
            --primary-blue-light: #3b82f6;
            --primary-blue-dark: #1e40af;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --border-radius: 8px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            background-color: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            line-height: 1.6;
        }

        .error-container {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius);
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 520px;
            width: 100%;
        }

        .error-icon {
            font-size: 2.5rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }

        .error-code {
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--primary-blue);
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-800);
            margin: 0 0 1rem 0;
        }

        .error-message {
            font-size: 1rem;
            color: var(--gray-600);
            margin: 0 0 2rem 0;
        }

        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: var(--border-radius);
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: var(--font-primary);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-blue-dark);
            color: #ffffff;
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--gray-700);
            border-color: var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-100);
            border-color: var(--gray-500);
        }

        @media (max-width: 480px) {
            .error-code { font-size: 3.5rem; }
            .error-title { font-size: 1.25rem; }
            .error-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="{% block icon %}fas fa-exclamation-triangle{% endblock %}" aria-hidden="true"></i>
        </div>
        <div class="error-code">{% block code %}404{% endblock %}</div>
        <h1 class="error-title">{% block heading %}Page Not Found{% endblock %}</h1>
        <p class="error-message">{% block message %}The page you're looking for doesn't exist or has been moved.{% endblock %}</p>

        <div class="error-actions">
            <a href="{{ url_for('main.index') if url_for else '/' }}" class="btn btn-primary">
                <i class="fas fa-home" aria-hidden="true"></i> Go Home
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Go Back
            </button>
        </div>
    </div>
</body>
</html>
